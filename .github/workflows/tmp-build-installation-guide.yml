name: Temporary - build installation guide PDF

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-guide:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF dependencies
        run: python -m pip install --disable-pip-version-check reportlab pymupdf
      - name: Build and render-verify PDF
        run: python scripts/build_installation_guide_pdf.py
      - name: Upload guide and page renders
        uses: actions/upload-artifact@v4
        with:
          name: research-agent-installation-guide
          path: |
            dist/research-agent-installation-guide.pdf
            dist/rendered-installation-guide/*.png
          if-no-files-found: error
