name: Validate and package Research-Agent Skills

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: research-agent-skills-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify release tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          expected="v$(tr -d '\n' < VERSION)"
          test "$expected" = "$GITHUB_REF_NAME" || {
            echo "Tag $GITHUB_REF_NAME does not match VERSION ($expected)" >&2
            exit 1
          }

      - name: Validate and package Skills
        run: python scripts/package_skills.py --output dist

      - name: Upload packaged distribution
        uses: actions/upload-artifact@v4
        with:
          name: research-agent-skill-packages-${{ github.sha }}
          path: dist/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packaged distribution
        uses: actions/download-artifact@v4
        with:
          name: research-agent-skill-packages-${{ github.sha }}
          path: dist

      - name: Publish or refresh GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          assets=(
            dist/research-agent-skills-v*.zip
            dist/research-agent-distribution.json
            dist/SHA256SUMS
          )
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Research-Agent $GITHUB_REF_NAME" \
              --generate-notes \
              --verify-tag
          fi
